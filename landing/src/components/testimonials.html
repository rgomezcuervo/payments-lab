<section id="testimonios" class="scroll-mt-20 bg-white py-16 sm:py-20" aria-labelledby="testimonios-heading" data-cms-section="testimonials">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl" data-reveal>
      <h2 id="testimonios-heading" class="text-3xl font-semibold tracking-tight text-slate-900 sm:text-4xl" data-i18n-key="testimonials.title">Historias que nos inspiran</h2>
      <p class="mt-3 text-lg text-slate-600" data-i18n-key="testimonials.lead">Comercios que confían en una experiencia de pago cálida y profesional.</p>
    </div>
    <div class="mt-12" id="cms-testimonials" data-cms-slot="testimonials-carousel">
      <div
        class="relative overflow-hidden rounded-3xl border border-slate-200 bg-slate-50/60 shadow-inner"
        data-carousel="testimonials"
        aria-roledescription="carrusel"
      >
        <div
          id="testimonials-carousel-slides"
          class="flex transition-transform duration-500 ease-out will-change-transform"
          data-carousel-track
          style="transform: translateX(0)"
          aria-live="polite"
        >
          <figure class="min-w-full px-6 py-10 sm:px-12" data-carousel-slide data-reveal>
            <blockquote class="text-lg leading-relaxed text-slate-800" data-i18n-key="testimonials.q1">
              “Pasamos de mensajes confusos a cobros que nuestros clientes entienden al primer vistazo.”
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-3">
              <span class="flex h-11 w-11 items-center justify-center rounded-full bg-teal-100 text-sm font-semibold text-teal-800" aria-hidden="true">LR</span>
              <div>
                <p class="font-semibold text-slate-900" data-i18n-key="testimonials.a1.name">Laura R.</p>
                <p class="text-sm text-slate-600" data-i18n-key="testimonials.a1.role">Retail · Bogotá</p>
              </div>
            </figcaption>
          </figure>
          <figure class="min-w-full px-6 py-10 sm:px-12" data-carousel-slide>
            <blockquote class="text-lg leading-relaxed text-slate-800" data-i18n-key="testimonials.q2">
              “El equipo acompañó la puesta en marcha con un tono cercano; eso marca la diferencia.”
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-3">
              <span class="flex h-11 w-11 items-center justify-center rounded-full bg-amber-100 text-sm font-semibold text-amber-900" aria-hidden="true">CM</span>
              <div>
                <p class="font-semibold text-slate-900" data-i18n-key="testimonials.a2.name">Carlos M.</p>
                <p class="text-sm text-slate-600" data-i18n-key="testimonials.a2.role">Servicios · Medellín</p>
              </div>
            </figcaption>
          </figure>
          <figure class="min-w-full px-6 py-10 sm:px-12" data-carousel-slide>
            <blockquote class="text-lg leading-relaxed text-slate-800" data-i18n-key="testimonials.q3">
              “Liquidaciones más claras nos devolvieron tiempo para enfocarnos en vender.”
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-3">
              <span class="flex h-11 w-11 items-center justify-center rounded-full bg-emerald-100 text-sm font-semibold text-emerald-900" aria-hidden="true">SV</span>
              <div>
                <p class="font-semibold text-slate-900" data-i18n-key="testimonials.a3.name">Sofía V.</p>
                <p class="text-sm text-slate-600" data-i18n-key="testimonials.a3.role">Gastronomía · Cali</p>
              </div>
            </figcaption>
          </figure>
        </div>
        <div class="flex items-center justify-between border-t border-slate-200/80 px-4 py-4 sm:px-8">
          <div class="flex gap-2" data-carousel-dots></div>
          <div class="flex gap-2" data-carousel-controls="testimonials">
            <button
              type="button"
              class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-800 shadow-sm hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600"
              data-carousel-prev
              aria-controls="testimonials-carousel-slides"
              aria-label="Testimonio anterior"
            >
              <span class="sr-only" data-i18n-key="testimonials.prev">Anterior</span>
              <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
            </button>
            <button
              type="button"
              class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-800 shadow-sm hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600"
              data-carousel-next
              aria-controls="testimonials-carousel-slides"
              aria-label="Siguiente testimonio"
            >
              <span class="sr-only" data-i18n-key="testimonials.next">Siguiente</span>
              <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
