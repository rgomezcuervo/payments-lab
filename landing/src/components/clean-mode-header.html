<div
  class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/95 backdrop-blur-md"
  data-clean-mode-surface
  data-i18n-key="cleanMode.headerAria"
  data-i18n-attr="aria-label"
  aria-label="Barra de modo limpio"
>
  <div
    class="relative mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-4 gap-y-3 px-4 py-3 sm:px-6 lg:px-8"
  >
    <a
      href="#clean-mode-root"
      class="order-1 flex min-w-0 shrink items-center gap-2 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[color:var(--brand-primary)]"
      data-brand-logo
      data-clean-header-option="brand"
    >
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-teal-600 to-emerald-600 text-sm font-bold text-white shadow-sm"
        aria-hidden="true"
        data-brand-logo-mark
        >MC</span
      >
      <span class="truncate text-base font-semibold tracking-tight text-slate-900 sm:text-lg" data-brand-name data-i18n-key="nav.brand">Mi Compañía</span>
    </a>
    <div class="order-2 flex flex-wrap items-center justify-end gap-2 sm:gap-3">
      <div class="relative inline-flex items-stretch" data-clean-header-option="language">
        <label class="sr-only" for="lang-select-clean" data-i18n-key="nav.langLabel">Idioma</label>
        <select
          id="lang-select-clean"
          data-lang-select
          class="h-10 min-w-[7.25rem] cursor-pointer appearance-none rounded-full border border-slate-200/90 bg-white/95 py-2 pl-4 pr-10 text-sm font-medium text-slate-700 shadow-sm ring-1 ring-slate-900/5 transition hover:border-slate-300 hover:bg-white focus-visible:border-[color:var(--brand-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-primary)]/25"
          data-i18n-key="nav.langSelectAria"
          data-i18n-attr="aria-label"
          aria-label="Seleccionar idioma del sitio"
        >
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
        <span
          class="pointer-events-none absolute right-3 top-1/2 flex h-5 w-5 -translate-y-1/2 items-center justify-center text-slate-500"
          aria-hidden="true"
        >
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </span>
      </div>
      <button
        type="button"
        class="inline-flex h-10 items-center justify-center rounded-full border border-slate-200/90 bg-white px-3 text-sm font-medium text-slate-700 shadow-sm ring-1 ring-slate-900/5 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[color:var(--brand-primary)]"
        data-clean-header-option="chatShortcut"
        data-clean-chat-open
        hidden
        data-i18n-key="cleanMode.openChat"
        data-i18n-attr="aria-label"
        aria-label="Abrir chat"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
      </button>
      <button
        type="button"
        class="inline-flex h-10 items-center justify-center rounded-full bg-[color:var(--brand-primary)] px-4 text-sm font-semibold text-white shadow-sm hover:bg-[color:var(--brand-primary-hover)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[color:var(--brand-primary)]"
        data-clean-header-option="exit"
        data-clean-mode-exit
        data-i18n-key="nav.cleanModeExit"
      >
        Salir del modo limpio
      </button>
    </div>
  </div>
</div>
